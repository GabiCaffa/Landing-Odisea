<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ODÍSEA</title>
    <meta name="description" content="ODÍSEA es una productora de eventos de música en Uruguay." />
    <meta name="keywords" content="ODÍSEA, techno, música electrónica, eventos, fiestas, Uruguay, Montevideo, underground" />
    <meta name="author" content="ODÍSEA" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="ODÍSEA" />
    <meta property="og:description" content="Productora de música y eventos en Uruguay" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_UY" />
    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@odisea.uy" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- Preconnect a Supabase: adelanta DNS+TLS para datos e imágenes de eventos -->
    <link rel="preconnect" href="https://ccdhjqqyriejeddbcpuu.supabase.co" crossorigin />
    <!-- Tema estacional: se aplica ANTES de que React monte.
         El valor manda desde la DB (site_settings, v19) y viaja por red; si
         esperáramos al bundle, cada carga mostraría un destello de la paleta
         clara antes de saltar a la oscura.

         Dos caminos, en este orden:
          1) El último tema conocido, cacheado en localStorage por ThemeContext.
             Instantáneo, y cubre a todo el que ya visitó el sitio.
          2) Para el que entra por PRIMERA vez no hay cache, así que el pedido a
             Supabase sale desde acá — antes de que el bundle exista. Con el
             preconnect de arriba ya resuelto, suele llegar para el primer
             pintado. Es lo más temprano que se puede sin renderizar en
             servidor, cosa que este sitio (SPA estática en Vercel) no hace.

         Sí, esto repite un poco de la lógica de ThemeContext. Es el precio de
         cualquier script anti-parpadeo: tiene que correr antes que la app. -->
    <script>
      (function () {
        // El panel no se tematiza (ver isThemedPath en ThemeContext).
        if (location.pathname.indexOf('/admin') === 0) return;

        function apply(t) {
          if (!t || t === 'base' || !/^[a-z-]{1,32}$/.test(t)) return;
          var el = document.documentElement;
          el.dataset.theme = t;
          // La tipografía estacional es sólo de la home (ver isShowcasePath).
          if (location.pathname === '/') el.dataset.surface = 'vidriera';
        }

        // ?tema=... gana y no consulta nada: es la vista previa.
        var preview = new URLSearchParams(location.search).get('tema');
        if (preview) { apply(preview); return; }

        try { apply(localStorage.getItem('odisea:theme')); } catch (e) {}

        // Adelanto del valor real para quien no tiene cache.
        try {
          var url = '%VITE_SUPABASE_URL%';
          var key = '%VITE_SUPABASE_ANON_KEY%';
          if (url.indexOf('http') !== 0) return; // sin env (dev sin .env): se deja al bundle
          fetch(url + '/rest/v1/site_settings?select=value&key=eq.theme', {
            headers: { apikey: key, Authorization: 'Bearer ' + key },
          })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (rows) {
              if (!rows || !rows[0]) return;
              apply(rows[0].value);
              try { localStorage.setItem('odisea:theme', rows[0].value); } catch (e) {}
            })
            .catch(function () {}); // Sin red: el bundle lo resuelve igual.
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
