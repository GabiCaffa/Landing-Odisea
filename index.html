<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título y descripción ─────────────────────────────────────────────
         Esto es literalmente lo que Google muestra debajo del link, así que
         se escribe para que alguien decida entrar, no para describir el sitio.

         Antes decía `<title>ODÍSEA</title>` y "ODÍSEA es una productora de
         eventos de música en Uruguay": el nombre repetido y ni una razón para
         hacer clic. Verificado en Google real, el sitio ya sale **primero** en
         "odisea fiesta" y "odisea oficial" — o sea que el problema nunca fue
         posicionar, sino qué decía el resultado.

         El título nombra la categoría ("fiestas", "música electrónica") porque
         nadie busca la marca sin conocerla; la descripción nombra las ciudades
         donde hay fechas, que es como busca alguien de la zona. Se cortan
         alrededor de los 60 y 160 caracteres: más largo, Google lo trunca. -->
    <title>ODÍSEA · Fiestas y eventos de música electrónica en Uruguay</title>
    <meta
      name="description"
      content="Productora de fiestas en Colonia del Sacramento, Paysandú y Nueva Helvecia. Mirá las próximas fechas, conseguí tu entrada y enterate de las promos."
    />
    <meta name="author" content="ODÍSEA" />
    <!-- Sin `keywords`: Google la ignora desde 2009 y la de acá nombraba
         Montevideo, que no es donde ODÍSEA hace fechas. -->

    <!-- Canonical: el dominio sin www redirige al www, pero decirlo explícito
         evita que un link con parámetros (?tema=, utm_…) se indexe aparte. -->
    <link rel="canonical" href="https://www.odiseaoficial.com/" />

    <!-- Open Graph — esto es lo que se ve al pegar el link en WhatsApp,
         Instagram o Facebook. Esas tres NO ejecutan JavaScript, así que estas
         etiquetas son TODO lo que reciben: si falta la imagen, el link sale
         pelado. Antes faltaba, y el sitio se comparte por WhatsApp. -->
    <meta property="og:site_name" content="ODÍSEA" />
    <meta property="og:title" content="ODÍSEA · Fiestas y eventos de música electrónica en Uruguay" />
    <meta
      property="og:description"
      content="Productora de fiestas en Colonia del Sacramento, Paysandú y Nueva Helvecia. Mirá las próximas fechas, conseguí tu entrada y enterate de las promos."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_UY" />
    <meta property="og:url" content="https://www.odiseaoficial.com/" />
    <!-- 1200×630 es la medida que WhatsApp, Instagram y Facebook usan para el
         preview GRANDE; con una imagen cuadrada lo degradan a una miniatura al
         costado. El nombre del archivo va sin espacios ni paréntesis a
         propósito: en una URL se vuelven `%20` y `%28`, y hay scrapers que los
         manejan mal. -->
    <meta property="og:image" content="https://www.odiseaoficial.com/og-odisea.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="ODÍSEA" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@odisea.uy" />
    <meta name="twitter:title" content="ODÍSEA · Fiestas y eventos de música electrónica en Uruguay" />
    <meta
      name="twitter:description"
      content="Productora de fiestas en Colonia del Sacramento, Paysandú y Nueva Helvecia. Mirá las próximas fechas, conseguí tu entrada y enterate de las promos."
    />
    <meta name="twitter:image" content="https://www.odiseaoficial.com/og-odisea.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- Preconnect a Supabase: adelanta DNS+TLS para datos e imágenes de eventos -->
    <link rel="preconnect" href="https://ccdhjqqyriejeddbcpuu.supabase.co" crossorigin />
    <!-- Pintado crítico del tema ───────────────────────────────────────────
         El script de abajo pone `data-theme` de inmediato, pero el CSS de la
         app NO está todavía: en desarrollo lo inyecta JavaScript y en
         producción, aunque sea un <link>, React todavía tiene que montar. Sin
         esto el primer cuadro se pinta con el fondo claro por defecto del
         navegador y recién después salta al oscuro — que es exactamente el
         destello que se veía.

         Los colores van escritos a mano y no como tokens a propósito: esto
         tiene que funcionar ANTES de que exista la hoja de estilos que define
         los tokens. Si se cambia --papel o --tinta en index.css, cambiar
         también acá. Son los dos únicos valores duplicados. -->
    <style>
      html { background: #FFFFFF; }
      html[data-theme="halloween"],
      html[data-theme="halloween"] body { background: #0B1D22; color: #E8EFEE; }

      /* ─── Pantalla de arranque ──────────────────────────────────────────
         Este sitio es una SPA: el HTML que llega trae `<div id="root">` VACÍO,
         así que hasta que no se bajan, parsean y EJECUTAN ~574 KB de
         JavaScript no hay absolutamente nada para pintar. Medido en un celular
         real eso son varios segundos de pantalla en blanco, y la queja era
         justamente ésa.

         Esto no acelera la carga: hace que lo primero que se ve sea la marca
         sobre el fondo del tema en vez de el vacío. Se pinta apenas el
         navegador lee el <body>, porque no depende ni del CSS de la app ni de
         una sola línea de JavaScript.

         Va FUERA de #root a propósito. Adentro, React lo borraría de golpe al
         montar y el hero —que arranca en opacity 0 y hace un fundido de 700ms—
         dejaría un parpadeo de contenido vacío. Superpuesto y con su propio
         fundido, los dos se cruzan.

         El logo va como background-image y no como <img> para que el navegador
         baje SÓLO la variante del tema activo. Los archivos de /public son
         byte a byte los mismos que src/assets/odisea-logo-*.png. */
      #arranque {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #FFFFFF;
        background-image: url("/email-logo-black.png");
        background-repeat: no-repeat;
        background-position: center;
        background-size: min(160px, 42vw) auto;
        opacity: 1;
        transition: opacity 0.6s ease;
      }
      html[data-theme="halloween"] #arranque {
        background-color: #0B1D22;
        background-image: url("/email-logo-white.png");
      }
      #arranque.arranque--listo { opacity: 0; pointer-events: none; }

      @keyframes arranque-latido { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes arranque-rendirse { to { opacity: 0; visibility: hidden; } }

      /* Dos animaciones, cada una con SU tiempo:
         1) el latido, para que se lea como "cargando" y no como una imagen
            colgada;
         2) un SEGURO a los 15s. Si el JavaScript nunca llega a correr (bundle
            caído, red que se corta a la mitad), esto se destapa solo en vez de
            dejar la pantalla tapada para siempre. En una carga normal nunca se
            ve: React lo quita muchísimo antes.
         El orden importa: las dos tocan `opacity` y, cuando la segunda arranca,
         gana la última de la lista. Antes de su retraso no pinta nada porque el
         relleno es `forwards`, no `backwards`. */
      #arranque {
        animation:
          arranque-latido 1.8s ease-in-out infinite,
          arranque-rendirse 0.6s ease 15s forwards;
      }
      @media (prefers-reduced-motion: reduce) {
        #arranque { animation: arranque-rendirse 0.6s ease 15s forwards; }
      }
      /* Al montar React manda el fundido de la clase, no las animaciones. */
      #arranque.arranque--listo { animation: none; }
    </style>

    <!-- Tema estacional: se aplica ANTES de que React monte.
         El valor manda desde la DB (site_settings, v19) y viaja por red; si
         esperáramos al bundle, cada carga mostraría un destello de la paleta
         clara antes de saltar a la oscura.

         Dos caminos, en este orden:
          1) El último tema conocido, cacheado en localStorage por ThemeContext.
             Instantáneo, y cubre a todo el que ya visitó el sitio.
          2) Para el que entra por PRIMERA vez no hay cache, así que el pedido a
             Supabase sale desde acá — antes de que el bundle exista. Con el
             preconnect de arriba ya resuelto, suele llegar para el primer
             pintado. Es lo más temprano que se puede sin renderizar en
             servidor, cosa que este sitio (SPA estática en Vercel) no hace.

         Sí, esto repite un poco de la lógica de ThemeContext. Es el precio de
         cualquier script anti-parpadeo: tiene que correr antes que la app. -->
    <script>
      (function () {
        var el = document.documentElement;

        function quitar() {
          delete el.dataset.theme;
          delete el.dataset.surface;
        }

        function apply(t) {
          // 'base' es la AUSENCIA de tema. Tiene que poder quitar el atributo,
          // no sólo poner: el build puede venir horneado con un tema que desde
          // entonces se apagó en el panel.
          if (t === 'base') return quitar();
          if (!t || !/^[a-z-]{1,32}$/.test(t)) return;
          el.dataset.theme = t;
          // Tiene que coincidir con ENTRADA_PATHS de ThemeContext: si no,
          // el título parpadea de Inter Tight a Creepster al montar React.
          var ENTRADA = ['/', '/login', '/registro', '/recuperar', '/reset-password'];
          if (ENTRADA.indexOf(location.pathname) !== -1) el.dataset.surface = 'vidriera';
          else delete el.dataset.surface;
        }

        // El panel no se tematiza (ver isThemedPath en ThemeContext). Se QUITA
        // y no se ignora, porque el atributo puede venir escrito en el HTML.
        if (location.pathname.indexOf('/admin') === 0) return quitar();

        // Si el HTML ya viene horneado (ver bakeTheme en vite.config.ts), esto
        // reafirma el data-surface que el build no puede saber: index.html se
        // sirve para todas las rutas.
        if (el.dataset.theme) apply(el.dataset.theme);

        // ?tema=... gana y no consulta nada: es la vista previa.
        var preview = new URLSearchParams(location.search).get('tema');
        if (preview) { apply(preview); return; }

        try {
          var guardado = localStorage.getItem('odisea:theme');
          if (guardado) apply(guardado);
        } catch (e) {}

        // Valor real de la base, para el que no tiene cache y por si cambió
        // desde el último deploy.
        try {
          var url = '%VITE_SUPABASE_URL%';
          var key = '%VITE_SUPABASE_ANON_KEY%';
          if (url.indexOf('http') !== 0) return; // sin env: se deja al bundle
          fetch(url + '/rest/v1/site_settings?select=value&key=eq.theme', {
            headers: { apikey: key, Authorization: 'Bearer ' + key },
          })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (rows) {
              if (!rows || !rows[0]) return;
              apply(rows[0].value);
              try { localStorage.setItem('odisea:theme', rows[0].value); } catch (e) {}
            })
            .catch(function () {}); // Sin red: el bundle lo resuelve igual.
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Lo primero que se ve, antes de que exista una línea de JavaScript.
         Lo quita OcultarArranque cuando React ya pintó (ver el <style> de
         arriba). `aria-hidden` porque no es contenido: es el telón. -->
    <div id="arranque" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
