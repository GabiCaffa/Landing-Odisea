<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ODÍSEA</title>
    <meta name="description" content="ODÍSEA es una productora de eventos de música en Uruguay." />
    <meta name="keywords" content="ODÍSEA, techno, música electrónica, eventos, fiestas, Uruguay, Montevideo, underground" />
    <meta name="author" content="ODÍSEA" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="ODÍSEA" />
    <meta property="og:description" content="Productora de música y eventos en Uruguay" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_UY" />
    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@odisea.uy" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- Preconnect a Supabase: adelanta DNS+TLS para datos e imágenes de eventos -->
    <link rel="preconnect" href="https://ccdhjqqyriejeddbcpuu.supabase.co" crossorigin />
    <!-- Tema estacional: se aplica ANTES de que React monte.
         El valor real vive en la DB (site_settings, v19) y llega por red; si
         esperáramos a eso, cada carga mostraría un flash de la paleta clara
         antes de saltar a la oscura. Acá se usa el último tema conocido,
         cacheado en localStorage por ThemeContext. -->
    <script>
      (function () {
        try {
          // El panel no se tematiza (ver isThemedPath en ThemeContext).
          if (location.pathname.indexOf('/admin') === 0) return;
          var t = localStorage.getItem('odisea:theme');
          // El regex es para no escribir en el DOM lo que haya quedado en
          // storage: sólo un nombre de tema tiene esta forma.
          if (t && t !== 'base' && /^[a-z-]{1,32}$/.test(t)) {
            document.documentElement.dataset.theme = t;
            // La tipografía estacional es sólo de la home (ver isShowcasePath).
            if (location.pathname === '/') {
              document.documentElement.dataset.surface = 'vidriera';
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
